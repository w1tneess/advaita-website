# Dependabot configuration for GitHub
# Automatically checks for security vulnerabilities and dependency updates
version: 2
updates:
  # Automated updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "w1tneess"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Automated updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "w1tneess"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
