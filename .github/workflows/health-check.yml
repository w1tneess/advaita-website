name: Production Health & Uptime Check

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Verify Live Site Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Production Endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          endpoints=(
            "https://advaitachandra.in"
            "https://advaitachandra.in/projects"
            "https://advaitachandra.in/philosophy"
            "https://advaitachandra.in/photography"
            "https://advaitachandra.in/blog"
            "https://advaitachandra.in/sitemap.xml"
            "https://advaitachandra.in/feed.json"
            "https://advaitachandra.in/llms.txt"
            "https://oshodocumentary.advaitachandra.in"
          )

          failed=0
          for url in "${endpoints[@]}"; do
            echo "Checking: $url"
            status=$(curl -s -o /dev/null -w "%{http_code}" -L --connect-timeout 10 --max-time 15 "$url")
            if [ "$status" -eq 200 ]; then
              echo "  ✓ OK (HTTP $status)"
            else
              echo "  ✗ FAILED (HTTP $status)"
              failed=1
            fi
          done

          # Check Vercel serverless keepalive health endpoint
          echo "Checking: https://advaitachandra.in/api/keepalive"
          if [ -n "${CRON_SECRET:-}" ]; then
            api_status=$(curl -s -o /dev/null -w "%{http_code}" -L --connect-timeout 10 --max-time 15 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://advaitachandra.in/api/keepalive")
          else
            api_status=$(curl -s -o /dev/null -w "%{http_code}" -L --connect-timeout 10 --max-time 15 \
              "https://advaitachandra.in/api/keepalive")
          fi

          if [ "$api_status" -eq 200 ]; then
            echo "  ✓ OK (HTTP $api_status)"
          else
            echo "  ✗ FAILED (HTTP $api_status)"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "One or more endpoint health checks failed."
            exit 1
          fi
          echo "All production endpoints healthy!"
