name: Automated Dependency Updates

on:
  schedule:
    # Run automatically every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    name: Check, Test & Apply Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies to latest compatible versions
        run: npm update

      - name: Verify ESLint rules
        run: npm run lint

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Validate Content Schemas
        run: npm run content:validate

      - name: Security Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Test Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://efpnrcwxvsvhlxqmvput.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmcG5yY3d4dnN2aGx4cW12cHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTY2ODEsImV4cCI6MjEwMzIzMjY4MX0.lTAG1di8VWD0MeRP1U2ZQKHzdDkzvW-RBrjD2I-_VRI' }}

      - name: Commit and Push Updates if Changed
        run: |
          if [ -n "$(git status --porcelain package.json package-lock.json)" ]; then
            echo "Updates found and fully verified! Committing changes..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(deps): autoupdate dependencies and lockfile [skip ci]"
            git push origin main
            echo "Successfully pushed dependency updates to main."
          else
            echo "All dependencies are already up-to-date. No commit needed."
          fi
