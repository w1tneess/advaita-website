name: Supabase Keepalive & Health Ping

on:
  schedule:
    # Run twice daily (04:00 and 16:00 UTC) so a single network glitch never causes a pause
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database (Real PostgreSQL Query)
        env:
          SUPABASE_URL: https://efpnrcwxvsvhlxqmvput.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmcG5yY3d4dnN2aGx4cW12cHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTY2ODEsImV4cCI6MjEwMzIzMjY4MX0.lTAG1di8VWD0MeRP1U2ZQKHzdDkzvW-RBrjD2I-_VRI
        run: |
          echo "Executing authenticated SELECT query against site_content table..."
          
          # Query site_content with select=id,updated_at to perform an active database read
          response=$(curl -w "%{http_code}" -s -o /tmp/supabase_res.json --connect-timeout 15 --max-time 30 -X GET "$SUPABASE_URL/rest/v1/site_content?select=id,updated_at&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "Supabase HTTP status: $response"
          cat /tmp/supabase_res.json || true
          echo ""

          if [ "$response" = "200" ] || [ "$response" = "206" ]; then
            echo "Success! Supabase PostgreSQL instance is active and queried."
          else
            echo "Failed to ping Supabase. HTTP Status: $response"
            exit 1
          fi
