# Builds the Vite site and publishes it with GitHub Pages.
#
# One-time setup: in the repository, go to Settings -> Pages and set
# Source = "GitHub Actions". Without that, this workflow builds fine but the
# deploy step has nowhere to publish to.
#
# The custom domain is kept attached by `public/CNAME`, which Vite copies into
# `dist/` on every build. Deleting that file would drop advaitachandra.in the
# next time this workflow runs.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run content:validate

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
