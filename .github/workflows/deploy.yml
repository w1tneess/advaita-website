# Builds the Vite site, validates the Worker, and deploys both to Cloudflare.
#
# One-time setup: in the repository, go to Settings -> Pages and set
# Source = "GitHub Actions". Without that, this workflow builds fine but the
# deploy step has nowhere to publish to.
#
# The custom domain is kept attached by `public/CNAME`, which Vite copies into
# `dist/` on every build. Deleting that file would drop advaitachandra.in the
# next time this workflow runs.

name: Build and deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Cloudflare Pages serves this custom-domain project from the origin root.
          # Do not reuse the old GitHub Pages repository-subpath variable here.
          BASE_PATH: /
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Validate Worker bundle
        run: npx --yes wrangler deploy --dry-run --outdir /tmp/advaita-worker

      - name: Deploy Pages site
        if: github.ref == 'refs/heads/main'
        run: npx --yes wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Deploy Worker
        if: github.ref == 'refs/heads/main'
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
