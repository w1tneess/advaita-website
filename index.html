<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--seo-->
		<!--/seo-->
		<link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
		<link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
		<script>
			(() => {
				try {
					const preference = localStorage.getItem('advaita-site.theme')
					const dark = preference === 'dark' ||
						(preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
					const root = document.documentElement
					root.classList.toggle('dark', dark)
					root.style.colorScheme = dark ? 'dark' : 'light'
				} catch {}
			})()
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
